<!DOCTYPE html>

    <title>E-connomiza</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <section class="section_main_form">
            <form action="/user" method="post">        
                <div class="campos_login">
                    <label for="user_name">Seu nome de usuário: </label>
                    <input 
                        type="text"
                        name="user_name"
                        id="user_name"
                        placeholder="Informe seu usuário:"
                    >
                </div>
                <div class="campos_login">
                    <label for="user_pw">Sua senha: </label>
                    <input type="password"
                        name="user_pw"
                        id="user_pw"
                        placeholder="Informe sua senha:"
                    >
                </div>

                <button type="submit">Acessar</button>

            </form>

        </section>
    </main>
